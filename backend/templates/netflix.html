<!-- NETFLIX INTRO-->

<div id="intro-screen">

            type="video/mp4">
    </video>
</div>

<header id="the-header">
    <div class="container">
        <h1>
            <br>
            WELCOME<br>
            TO OUR<br>
            CLONED NETFLIX
        </h1>
    </div>
</header>

<img
id="main-header"
src="{{ url_for('static', path='logo.png') }}"
alt="Netflix Logo">

<div class="button-container">
    <a href="/create-profile" class="button">Create Account</a>
    <a href="/welcome" class="button">Login</a>
</div>
{% endblock content %}

    document.addEventListener("DOMContentLoaded", function () {
        const introScreen = document.getElementById("intro-screen");
        const introVideo = document.getElementById("intro-video");

        if (!introScreen || !introVideo) {
            return;
        }

        function hideIntro() {
            introScreen.style.display = "none";
        }

        introVideo.addEventListener("ended", hideIntro);
        introVideo.addEventListener("error", hideIntro);

        // Fallback in case the browser does not trigger "ended".
        introVideo.addEventListener("loadedmetadata", function () {
            if (Number.isFinite(introVideo.duration)) {
                setTimeout(hideIntro, introVideo.duration * 1000 + 500);
            }
        });

        introVideo.play().catch(function () {
            hideIntro();
        });
    });
</script>

{% endblock extra_js %}
