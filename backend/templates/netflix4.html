{% extends "base.html" %}

{% block extra_css %}

<link rel="stylesheet"
    href="{{ url_for('static', path='netflix4.css') }}">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
{% endblock extra_css %}

{% block content %}

<header>
    <div class="netflix-logo"> NETFLIX </div>
    <div
        class="profile"
        onclick='window.location.href="/profile";'>
        <i class="fa-solid fa-circle-user"></i>
    </div>
</header>

<main>

<div class="search-area">
    <input
        type="text"
        name="movie-search"
        id="movie-search"
        placeholder="NEW"
        autocomplete="off">
    <button id="search-button"> Search </button>
</div>

<div id="movie-results"></div>
</main>

<footer>
<a href="/" class="sign-out"> Sign Out </a>
</footer>

{% endblock content %}

{% block extra_js %}

<script src="{{ url_for('static', path='netflix4.js') }}"></script>
{% endblock extra_js %}
