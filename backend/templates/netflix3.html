{% extends "base.html" %} 
 
{% block extra_css %} 
 
<link rel="stylesheet" 
    href="{{ url_for('static', path='netflix3.css') }}"> 
{% endblock extra_css %} 
 
{% block content %} 
 
<img 
class="image" 
src="{{ url_for('static', path='background2.jpg') }}" 
alt="Netflix Background"> 

{% if error %} 
    <p id= "login-error" class="login-error">{{ error }}</p> 
{% endif %} 
 
<h1 class="welcome-text"> 
    Welcome Back 
</h1> 

<img 
class="netflix-logo" 
src="{{ url_for('static', path='logo.png') }}" 
alt="Netflix Logo"> 
 
<form class="my-form" id = "login-form" action="/login" method="POST"> 
 
<div class="form-group"> 
    <label for="email"></label> 
    <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Enter your email" 
        required> 
</div> 
<br> 
 
<div class="form-group"> 
    <label for="password"></label> 
    <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Enter your password" 
        required> 
</div> 

<button class="submit-button" type="submit"> 
    Submit 
</button> 
</form> 
  
{% endblock content %}
